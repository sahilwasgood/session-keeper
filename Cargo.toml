[package]
name = "session-keeper-rust"
version = "0.1.0"
edition = "2021"

[lib]
name = "session_keeper_rust"
path = "src/lib.rs"

[[bin]]
name = "session-keeper-rust"
path = "src/main.rs"

[dependencies]
gtk = "0.18"
glib = "0.18"
rusqlite = { version = "0.31", features = ["bundled"] }
serde = { version = "1", features = ["derive"] }
serde_json = "1"
ureq = "2"
